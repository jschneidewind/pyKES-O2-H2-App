[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykes_o2_h2_app"
version = "0.1.0"
description = "Python package for simulatenous detection of H2 and O2."
authors = [
    {name = "Jacob Schneidewind", email = "pyH2A.pypi@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "matplotlib>=3.7.5",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "pykes>=0.1.2",
    "scipy>=1.10.1",
]

[project.urls]
"Homepage" = "https://github.com/jschneidewind/multi_timescale_model"
"Bug Tracker" = "https://github.com/jschneidewind/multi_timescale_model/issues"
